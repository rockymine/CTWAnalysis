# Per-map layout configuration for island detection.
#
# layer:                   which extraction mode to use for island analysis.
#                          one of: y0, bedrock, lowest_solid, top_surface
# exclude:                 block IDs to skip during extraction (or post-filter for y0).
#                          omit or leave empty when no exclusions are needed.
# exclude_observer_island: true → find the observer (default) spawn island after
#                          extraction and exclude it from symmetry analysis.
#                          only set for maps where the observer spawn produces
#                          a spurious island not part of the playable area.
# exclude_islands:         list of island IDs to exclude from symmetry analysis,
#                          beyond the one found by observer auto-detection.
#                          use for any non-playable islands (scenery, platforms,
#                          extra observer areas) that are not auto-detected.
# playable_bbox:           [min_x, min_z, max_x, max_z] — any island whose
#                          center falls outside this box is excluded from
#                          symmetry analysis. use for maps with many scenery
#                          islands surrounding the playable area (e.g. oumuamua).
# skip:                    true to exclude this map from the pipeline entirely.

