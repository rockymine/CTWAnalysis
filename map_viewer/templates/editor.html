<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTW Map Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='viewer.css') }}"/>
</head>
<body>

<div id="topbar">
  <a href="/" id="back-link" class="topbar-back">&#8592; Dashboard</a>
  <h1>CTW Map Editor</h1>
  <span id="map-name-display" class="topbar-map-name"></span>
  <span id="status"></span>
  <span class="topbar-divider"></span>
  <button id="export-xml-btn" class="topbar-btn" disabled>Export XML</button>
</div>

<div id="main">
  <nav id="activity-rail">
    <button class="activity-btn" id="activity-overview" title="Overview" disabled data-status="">
      <i data-lucide="book-open-text"></i>
    </button>
    <button class="activity-btn" disabled title="Players &amp; Teams">
      <i data-lucide="users"></i>
    </button>
    <button class="activity-btn" disabled title="Objective">
      <i data-lucide="goal"></i>
    </button>
    <button class="activity-btn active" id="activity-regions" title="Regions">
      <i data-lucide="layout-dashboard"></i>
    </button>
    <button class="activity-btn" disabled title="Rules &amp; Filters">
      <i data-lucide="gavel"></i>
    </button>
    <button class="activity-btn" disabled title="Validation">
      <i data-lucide="bug"></i>
    </button>
    <button class="activity-btn" disabled title="Export">
      <i data-lucide="archive"></i>
    </button>
  </nav>

  <div id="activity-viewport">

    <!-- Overview workspace -->
    <div id="overview-workspace" hidden>

      <!-- Left panel: map identity + authors -->
      <div id="ov-left">
        <div id="ov-left-scroll">
          <section class="ov-section">
            <h2 class="ov-section-title">Map Identity</h2>
            <div class="ov-field">
              <label class="ov-label" for="ov-name">Map Name <span class="ov-required">*</span></label>
              <input id="ov-name" class="ov-input" type="text" placeholder="My CTW Map"/>
            </div>
            <div class="ov-field-row">
              <div class="ov-field">
                <label class="ov-label" for="ov-version">Version <span class="ov-required">*</span></label>
                <input id="ov-version" class="ov-input" type="text" placeholder="1.0.0"/>
              </div>
              <div class="ov-field">
                <label class="ov-label" for="ov-gamemode">Gamemode <span class="ov-required">*</span></label>
                <input id="ov-gamemode" class="ov-input" type="text" placeholder="ctw"/>
              </div>
            </div>
            <div class="ov-field">
              <label class="ov-label" for="ov-objective">Objective</label>
              <input id="ov-objective" class="ov-input" type="text" placeholder="Capture all enemy wools!"/>
            </div>
          </section>

          <section class="ov-section">
            <h2 class="ov-section-title">Authors</h2>
            <div id="ov-authors-list"></div>
            <button id="ov-add-author" class="action-btn">+ Add author</button>
          </section>

          <section class="ov-section">
            <h2 class="ov-section-title">Contributors</h2>
            <div id="ov-contributors-list"></div>
            <button id="ov-add-contributor" class="action-btn">+ Add contributor</button>
          </section>

          <div class="ov-actions">
            <button id="ov-save-btn" class="action-btn action-btn--primary" disabled>Save changes</button>
            <span id="ov-save-status"></span>
          </div>
        </div>
      </div>

      <div class="sidebar-handle" id="ov-left-handle"></div>

      <!-- Canvas: blocks layer + symmetry axis overlay -->
      <div id="ov-canvas-wrap">
        <svg id="ov-map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="sidebar-handle" id="ov-right-handle"></div>

      <!-- Right panel: symmetry configuration -->
      <div id="ov-right">
        <div id="ov-symmetry-panel">
          <h2 class="ov-section-title">Symmetry Axis</h2>
          <div id="ov-sym-body">
            <p class="ov-sym-loading">Loading…</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Regions workspace -->
    <div id="regions-workspace">
      <div id="layers">
        <div id="layers-header">REGIONS</div>
        <div id="region-list">
          <div id="empty-msg">No map loaded</div>
        </div>
      </div>
      <div class="sidebar-handle" id="left-handle"></div>
      <div id="canvas-wrap">
        <div id="canvas-subbar">
          <div id="draw-toolbar">
            <button id="tool-move"   class="draw-tool-btn" title="Move"          disabled>
              <i data-lucide="hand"></i>
            </button>
            <button id="tool-select" class="draw-tool-btn" title="Select"        disabled>
              <i data-lucide="mouse-pointer-2"></i>
            </button>
            <button id="tool-rect"   class="draw-tool-btn" title="Rectangle (R)" disabled>
              <i data-lucide="rectangle-horizontal"></i>
            </button>
            <button id="tool-cuboid"   class="draw-tool-btn" title="Cuboid (C)"    disabled>
              <i data-lucide="box"></i>
            </button>
            <button id="tool-cylinder" class="draw-tool-btn" title="Cylinder (Y)"  disabled>
              <i data-lucide="cylinder"></i>
            </button>
            <button id="tool-point"    class="draw-tool-btn" title="Point (P)"     disabled>
              <i data-lucide="dot"></i>
            </button>
            <button id="tool-block"    class="draw-tool-btn" title="Block (B)"     disabled>
              <i data-lucide="square"></i>
            </button>
          </div>
          <div id="cursor-coords"></div>
          <div id="canvas-subbar-right">
            <span id="zoom-level">—</span>
            <div class="subbar-sep"></div>
            <label class="layer-item"><input type="checkbox" id="toggle-blocks"><span>Blocks</span></label>
            <label class="layer-item"><input type="checkbox" id="toggle-pois"><span>POIs</span></label>
            <label class="layer-item"><input type="checkbox" id="toggle-build"><span>Build</span></label>
          </div>
        </div>
        <div id="svg-area">
          <svg id="map-svg" xmlns="http://www.w3.org/2000/svg">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                  fill="#334155" font-size="14">Loading map…</text>
          </svg>
        </div>
      </div>
      <div class="sidebar-handle" id="right-handle"></div>
      <div id="inspector">
        <div id="region-detail-wrap">
          <div id="region-detail"></div>
        </div>
        <div id="history-panel">
          <div class="history-panel-title">History</div>
          <div id="history-list"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
<script>
(function () {
  function initSidebarResize(handle, sidebar, side, min, max) {
    handle.addEventListener('mousedown', function (e) {
      e.preventDefault();
      handle.classList.add('sidebar-handle--dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ew-resize';
      var startX = e.clientX;
      var startW = sidebar.offsetWidth;

      function onMove(e) {
        var delta = side === 'left' ? e.clientX - startX : startX - e.clientX;
        sidebar.style.width = Math.max(min, Math.min(max, startW + delta)) + 'px';
      }
      function onUp() {
        handle.classList.remove('sidebar-handle--dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  initSidebarResize(document.getElementById('left-handle'),  document.getElementById('layers'),    'left',  160, 480);
  initSidebarResize(document.getElementById('right-handle'), document.getElementById('inspector'), 'right', 220, 500);
  initSidebarResize(document.getElementById('ov-left-handle'),  document.getElementById('ov-left'),  'left',  200, 480);
  initSidebarResize(document.getElementById('ov-right-handle'), document.getElementById('ov-right'), 'right', 180, 420);
}());
</script>
</body>
</html>
