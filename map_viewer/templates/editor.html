<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTW Map Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='viewer.css') }}"/>
</head>
<body>

<div id="topbar">
  <a href="/" class="topbar-breadcrumb-home" title="Back to dashboard">
    <i data-lucide="folder"></i>
    <span>Maps</span>
  </a>
  <span class="topbar-sep">›</span>
  <span id="topbar-map-name" class="topbar-crumb"></span>
  <span class="topbar-sep">›</span>
  <span id="topbar-version" class="topbar-crumb topbar-crumb--dim"></span>
  <span id="status"></span>
  <span class="topbar-divider"></span>
  <button id="export-xml-btn" class="topbar-btn" disabled>Export XML</button>
</div>

<div id="main">
  <nav id="activity-rail">
    <div class="activity-logo">
      <div class="activity-logo-box">
        <span class="activity-logo-ctw">ctw</span>
        <span class="activity-logo-sub">Editor</span>
      </div>
    </div>
    <button class="activity-btn active" id="activity-overview" title="Overview" disabled data-status="">
      <i data-lucide="book-open-text"></i>
    </button>
    <button class="activity-btn" id="activity-teams" title="Teams" disabled data-status="">
      <i data-lucide="users"></i>
    </button>
    <button class="activity-btn" id="activity-objective" title="Objective" disabled>
      <i data-lucide="goal"></i>
    </button>
    <button class="activity-btn" id="activity-regions" title="Regions">
      <i data-lucide="layout-dashboard"></i>
    </button>
    <button class="activity-btn" disabled title="Rules &amp; Filters">
      <i data-lucide="gavel"></i>
    </button>
    <button class="activity-btn" disabled title="Validation">
      <i data-lucide="bug"></i>
    </button>
    <button class="activity-btn" disabled title="Export">
      <i data-lucide="archive"></i>
    </button>
  </nav>

  <div id="activity-viewport">

    <!-- Overview workspace -->
    <div id="overview-workspace">

      <!-- Left panel: map identity + authors -->
      <div id="ov-left">
        <div id="ov-left-scroll">
          <section class="ov-section">
            <h2 class="ov-section-title">Map Identity</h2>
            <div class="ov-field">
              <label class="ov-label" for="ov-name">Map Name <span class="ov-required">*</span></label>
              <input id="ov-name" class="ov-input" type="text" placeholder="My CTW Map"/>
            </div>
            <div class="ov-field-row">
              <div class="ov-field">
                <label class="ov-label" for="ov-version">Version <span class="ov-required">*</span></label>
                <input id="ov-version" class="ov-input" type="text" placeholder="1.0.0"/>
              </div>
              <div class="ov-field">
                <label class="ov-label" for="ov-gamemode">Gamemode <span class="ov-required">*</span></label>
                <input id="ov-gamemode" class="ov-input" type="text" placeholder="ctw"/>
              </div>
            </div>
            <div class="ov-field">
              <label class="ov-label" for="ov-objective">Objective</label>
              <textarea id="ov-objective" class="ov-input ov-input--textarea" rows="2" placeholder="Capture all enemy wools!"></textarea>
            </div>
          </section>

          <section class="ov-section">
            <h2 class="ov-section-title">Authors</h2>
            <div id="ov-authors-list"></div>
            <button id="ov-add-author" class="action-btn">+ Add author</button>
          </section>

          <section class="ov-section">
            <h2 class="ov-section-title">Contributors</h2>
            <div id="ov-contributors-list"></div>
            <button id="ov-add-contributor" class="action-btn">+ Add contributor</button>
          </section>

          <div class="ov-actions">
            <button id="ov-save-btn" class="action-btn action-btn--primary" disabled>Save changes</button>
            <span id="ov-save-status"></span>
          </div>
        </div>
      </div>

      <div class="sidebar-handle" id="ov-left-handle"></div>

      <!-- Canvas: blocks layer + symmetry axis overlay -->
      <div id="ov-canvas-wrap">
        <svg id="ov-map-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <div class="sidebar-handle" id="ov-right-handle"></div>

      <!-- Right panel: symmetry configuration -->
      <div id="ov-right">
        <div id="ov-symmetry-panel">
          <div id="ov-sym-body">
            <p class="ov-sym-loading">Loading…</p>
          </div>
        </div>
      </div>

    </div>

    <!-- Teams workspace -->
    <div id="pt-workspace" hidden>

      <!-- Left panel: teams list (top) + spawn region list (bottom) -->
      <div id="pt-left">
        <div id="pt-teams-section">
          <div class="pt-section-header">
            <h2 class="ov-section-title">Teams</h2>
            <button id="pt-add-team-btn" class="action-btn">+ Add team</button>
          </div>
          <div id="pt-teams-list"></div>
        </div>
        <div class="pt-left-divider"></div>
        <div id="pt-spawns-section">
          <div class="pt-section-header">
            <h2 class="ov-section-title">Spawn Regions</h2>
          </div>
          <div id="pt-spawn-list"></div>
        </div>
      </div>

      <div class="sidebar-handle" id="pt-left-handle"></div>

      <!-- Canvas: map overview with spawn regions highlighted -->
      <div id="pt-canvas-wrap">
        <div id="pt-canvas-subbar">
          <div id="pt-draw-toolbar">
            <button id="pt-tool-move"     class="draw-tool-btn" title="Move (M)"     disabled>
              <i data-lucide="hand"></i>
            </button>
            <button id="pt-tool-select"   class="draw-tool-btn" title="Select"       disabled>
              <i data-lucide="mouse-pointer-2"></i>
            </button>
            <button id="pt-tool-cylinder" class="draw-tool-btn" title="Cylinder (Y)" disabled>
              <i data-lucide="cylinder"></i>
            </button>
            <button id="pt-tool-point"    class="draw-tool-btn" title="Point (P)"    disabled>
              <i data-lucide="dot"></i>
            </button>
          </div>
          <div id="pt-cursor-coords"></div>
          <div id="pt-canvas-subbar-right">
            <span id="pt-zoom-level">—</span>
          </div>
        </div>
        <div id="pt-svg-area">
          <svg id="pt-map-svg" xmlns="http://www.w3.org/2000/svg">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                  fill="#334155" font-size="14">Loading map…</text>
          </svg>
        </div>
      </div>

      <div class="sidebar-handle" id="pt-right-handle"></div>

      <!-- Right panel: team or spawn inspector -->
      <div id="pt-right">
        <div id="pt-right-scroll">

          <!-- Team inspector (shown when a team row is selected) -->
          <div id="pt-team-inspector" hidden>
            <section class="ov-section">
              <h2 class="ov-section-title">Team</h2>
              <div class="ov-field">
                <label class="ov-label" for="pt-team-id">ID <span class="ov-required">*</span></label>
                <input id="pt-team-id" class="ov-input" type="text" placeholder="e.g. blue-team" spellcheck="false"/>
              </div>
              <div class="ov-field">
                <label class="ov-label" for="pt-team-name">Display Name</label>
                <input id="pt-team-name" class="ov-input" type="text" placeholder="e.g. Blue"/>
              </div>
              <div class="ov-field">
                <label class="ov-label" for="pt-team-color">Chat Color <span class="ov-required">*</span></label>
                <div class="pt-color-pick-row">
                  <span id="pt-team-color-swatch" class="pt-color-swatch-lg"></span>
                  <select id="pt-team-color" class="ov-input"></select>
                </div>
              </div>
              <div class="ov-field">
                <label class="ov-label" for="pt-team-dye-color">Dye Color</label>
                <div class="pt-color-pick-row">
                  <span id="pt-team-dye-color-swatch" class="pt-color-swatch-lg"></span>
                  <select id="pt-team-dye-color" class="ov-input"></select>
                </div>
              </div>
              <div class="ov-field-row">
                <div class="ov-field">
                  <label class="ov-label" for="pt-team-max">Max Players</label>
                  <input id="pt-team-max" class="ov-input" type="number" min="1" max="500" value="20"/>
                </div>
                <div class="ov-field">
                  <label class="ov-label" for="pt-team-min">Min Players</label>
                  <input id="pt-team-min" class="ov-input" type="number" min="0" max="500" value="0"/>
                </div>
              </div>
            </section>
          </div>

          <!-- Spawn inspector (shown when a spawn region is selected) -->
          <div id="pt-spawn-inspector" hidden>
            <!-- RegionDetail renders here: region name, type, geometry, XML preview -->
            <div id="pt-spawn-region-detail"></div>
            <!-- Spawn-specific configuration -->
            <section class="ov-section" id="pt-spawn-assignment">
              <h2 class="ov-section-title">Spawn Assignment</h2>
              <div class="ov-field">
                <label class="ov-label" for="pt-spawn-team">Team</label>
                <select id="pt-spawn-team" class="ov-input"></select>
              </div>
              <div class="ov-field">
                <label class="ov-label" for="pt-spawn-yaw">Yaw (°)</label>
                <input id="pt-spawn-yaw" class="ov-input" type="number" step="1" min="-180" max="180" placeholder="0"/>
              </div>
              <div class="ov-field">
                <label class="ov-label" for="pt-spawn-kit">Kit</label>
                <input id="pt-spawn-kit" class="ov-input" type="text" placeholder="e.g. spawn-kit" spellcheck="false"/>
              </div>
              <div class="ov-actions">
                <button id="pt-spawn-unlink-btn" class="action-btn pt-action-btn--danger">Remove spawn link</button>
              </div>
            </section>
          </div>

          <!-- Empty state -->
          <div id="pt-inspector-empty">
            <p class="pt-empty-msg">Select a team or spawn region to inspect.</p>
          </div>

        </div>
      </div>

    </div>

    <!-- Objective workspace -->
    <div id="obj-workspace" hidden>

      <!-- Left panel: wool list -->
      <div id="obj-left">
        <div class="pt-section-header">
          <h2 class="ov-section-title">Wools</h2>
          <button id="obj-add-wool-btn" class="action-btn">+ Add wool</button>
        </div>
        <div id="obj-wool-list"></div>
      </div>

      <div class="sidebar-handle" id="obj-left-handle"></div>

      <!-- Canvas: map overview with wool / monument POI markers -->
      <div id="obj-canvas-wrap">
        <div id="obj-canvas-subbar">
          <div id="obj-draw-toolbar">
            <button id="obj-tool-move"   class="draw-tool-btn" title="Move (M)"  disabled>
              <i data-lucide="hand"></i>
            </button>
            <button id="obj-tool-select" class="draw-tool-btn" title="Select"    disabled>
              <i data-lucide="mouse-pointer-2"></i>
            </button>
          </div>
          <div id="obj-cursor-coords"></div>
          <div id="obj-canvas-subbar-right">
            <span id="obj-zoom-level">—</span>
          </div>
        </div>
        <div id="obj-svg-area">
          <svg id="obj-map-svg" xmlns="http://www.w3.org/2000/svg">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                  fill="#334155" font-size="14">Loading map…</text>
          </svg>
        </div>
      </div>

      <div class="sidebar-handle" id="obj-right-handle"></div>

      <!-- Right panel: wool inspector -->
      <div id="obj-right">
        <div id="obj-right-scroll">

          <!-- Empty state -->
          <div id="obj-inspector-empty">
            <p class="pt-empty-msg">Select a wool to inspect.</p>
          </div>

          <!-- Wool inspector (shown on selection) -->
          <div id="obj-wool-inspector" hidden>
            <section class="ov-section">
              <h2 class="ov-section-title">Wool</h2>
              <div class="ov-field">
                <label class="ov-label">Color</label>
                <div class="pt-color-pick-row">
                  <span id="obj-wool-color-swatch" class="pt-color-swatch-lg"></span>
                  <select id="obj-wool-color-sel" class="ov-input"></select>
                </div>
              </div>
              <div class="ov-field">
                <label class="ov-label">Defender</label>
                <div class="pt-color-pick-row">
                  <span id="obj-defender-swatch" class="pt-color-swatch-lg"></span>
                  <select id="obj-defender-sel" class="ov-input"></select>
                </div>
              </div>
              <div class="ov-field">
                <label class="ov-label">Room Region</label>
                <div class="pt-color-pick-row">
                  <select id="obj-wool-room-sel" class="ov-input"></select>
                  <button id="obj-wool-room-clear-btn" class="action-btn" title="Clear room region">✕</button>
                </div>
              </div>
              <div class="ov-field">
                <label class="ov-label">Respawn</label>
                <span id="obj-respawn-badge" class="obj-respawn-badge obj-respawn-unknown">—</span>
              </div>
              <div class="ov-field">
                <label class="ov-label">Location</label>
                <div id="obj-inspector-location" class="detail-group-row"></div>
              </div>
              <div class="ov-field">
                <label class="ov-label">Monument Captures</label>
                <div id="obj-inspector-captures" class="obj-captures-list"></div>
              </div>
              <div class="ov-actions">
                <button id="obj-delete-wool-btn" class="action-btn pt-action-btn--danger">Delete wool</button>
              </div>
            </section>
          </div>

        </div>
      </div>

    </div>

    <!-- Regions workspace -->
    <div id="regions-workspace" hidden>
      <div id="layers">
        <div id="layers-header">REGIONS</div>
        <div id="region-list">
          <div id="empty-msg">No map loaded</div>
        </div>
      </div>
      <div class="sidebar-handle" id="left-handle"></div>
      <div id="canvas-wrap">
        <div id="canvas-subbar">
          <div id="draw-toolbar">
            <button id="tool-move"   class="draw-tool-btn" title="Move"          disabled>
              <i data-lucide="hand"></i>
            </button>
            <button id="tool-select" class="draw-tool-btn" title="Select"        disabled>
              <i data-lucide="mouse-pointer-2"></i>
            </button>
            <button id="tool-rect"   class="draw-tool-btn" title="Rectangle (R)" disabled>
              <i data-lucide="rectangle-horizontal"></i>
            </button>
            <button id="tool-cuboid"   class="draw-tool-btn" title="Cuboid (C)"    disabled>
              <i data-lucide="box"></i>
            </button>
            <button id="tool-cylinder" class="draw-tool-btn" title="Cylinder (Y)"  disabled>
              <i data-lucide="cylinder"></i>
            </button>
            <button id="tool-circle"   class="draw-tool-btn" title="Circle (O)"    disabled>
              <i data-lucide="circle"></i>
            </button>
            <button id="tool-point"    class="draw-tool-btn" title="Point (P)"     disabled>
              <i data-lucide="dot"></i>
            </button>
            <button id="tool-block"    class="draw-tool-btn" title="Block (B)"     disabled>
              <i data-lucide="square"></i>
            </button>
          </div>
          <div id="cursor-coords"></div>
          <div id="canvas-subbar-right">
            <span id="zoom-level">—</span>
            <div class="subbar-sep"></div>
            <label class="layer-item"><input type="checkbox" id="toggle-blocks"><span>Blocks</span></label>
            <label class="layer-item"><input type="checkbox" id="toggle-pois"><span>POIs</span></label>
            <label class="layer-item"><input type="checkbox" id="toggle-build"><span>Build</span></label>
          </div>
        </div>
        <div id="svg-area">
          <svg id="map-svg" xmlns="http://www.w3.org/2000/svg">
            <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
                  fill="#334155" font-size="14">Loading map…</text>
          </svg>
        </div>
      </div>
      <div class="sidebar-handle" id="right-handle"></div>
      <div id="inspector">
        <div id="region-detail-wrap">
          <div id="region-detail"></div>
        </div>
        <div id="history-panel">
          <div class="history-panel-title">History</div>
          <div id="history-list"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
<script>
(function () {
  function initSidebarResize(handle, sidebar, side, min, max) {
    handle.addEventListener('mousedown', function (e) {
      e.preventDefault();
      handle.classList.add('sidebar-handle--dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ew-resize';
      var startX = e.clientX;
      var startW = sidebar.offsetWidth;

      function onMove(e) {
        var delta = side === 'left' ? e.clientX - startX : startX - e.clientX;
        sidebar.style.width = Math.max(min, Math.min(max, startW + delta)) + 'px';
      }
      function onUp() {
        handle.classList.remove('sidebar-handle--dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  }

  initSidebarResize(document.getElementById('left-handle'),  document.getElementById('layers'),    'left',  160, 480);
  initSidebarResize(document.getElementById('right-handle'), document.getElementById('inspector'), 'right', 260, 500);
  initSidebarResize(document.getElementById('ov-left-handle'),  document.getElementById('ov-left'),  'left',  200, 480);
  initSidebarResize(document.getElementById('ov-right-handle'), document.getElementById('ov-right'), 'right', 180, 420);
  initSidebarResize(document.getElementById('pt-left-handle'),  document.getElementById('pt-left'),  'left',  180, 420);
  initSidebarResize(document.getElementById('pt-right-handle'), document.getElementById('pt-right'), 'right', 240, 480);
  initSidebarResize(document.getElementById('obj-left-handle'),  document.getElementById('obj-left'),  'left',  160, 400);
  initSidebarResize(document.getElementById('obj-right-handle'), document.getElementById('obj-right'), 'right', 220, 460);
}());
</script>
</body>
</html>
