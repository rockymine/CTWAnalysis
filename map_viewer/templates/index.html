<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTW Map Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='viewer.css') }}"/>
</head>
<body>

<div id="topbar">
  <h1>CTW Map Viewer</h1>
  <select id="map-select"><option value="">— select map —</option></select>
  <span id="status"></span>
  <span class="topbar-divider"></span>
  <label class="poi-toggle"><input type="checkbox" id="toggle-spawns" checked> spawns</label>
  <label class="poi-toggle"><input type="checkbox" id="toggle-wools"  checked> wools</label>
  <span class="topbar-divider"></span>
  <button id="export-xml-btn" class="topbar-btn" disabled>Export XML</button>
</div>

<div id="main">
  <div id="layers">
    <div id="layers-header">Regions</div>
    <div id="region-list">
      <div id="empty-msg">No map loaded</div>
    </div>
  </div>
  <div id="canvas-wrap">
    <svg id="map-svg" xmlns="http://www.w3.org/2000/svg">
      <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle"
            fill="#334155" font-size="14">Select a map to begin</text>
    </svg>
    <div id="cursor-coords"></div>
    <div id="draw-toolbar">
      <button id="tool-rect" class="draw-tool-btn" title="Rectangle (R)" disabled>
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1.5" y="3.5" width="12" height="8" rx="1"/>
        </svg>
      </button>
    </div>
  </div>
  <div id="inspector">
    <div id="region-detail"></div>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
