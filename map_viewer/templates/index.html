<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CTW Analysis IDE</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='viewer.css') }}"/>
</head>
<body class="dashboard-page">

<div id="topbar">
  <h1>CTW Analysis IDE</h1>
  <span id="status" class="topbar-status"></span>
  <a href="/concept" class="topbar-btn" style="text-decoration:none;margin-left:auto">Layout Concept Tool</a>
</div>

<div id="dashboard">

  <section id="config-section">
    <div class="config-row">
      <label class="config-label">Maps folder</label>
      <input type="text" id="maps-folder-input" class="config-input" placeholder="Path to the folder containing map folders">
      <span class="config-path-status" id="maps-folder-status"></span>
    </div>
    <div class="config-row">
      <label class="config-label">Output folder</label>
      <input type="text" id="output-folder-input" class="config-input" placeholder="Path to the pipeline output folder">
      <span class="config-path-status" id="output-folder-status"></span>
    </div>
    <div class="config-actions">
      <button id="save-config-btn" class="action-btn">Save Configuration</button>
      <span id="config-save-status" class="config-save-msg"></span>
    </div>
  </section>

  <div id="workspace">
    <div id="map-list-panel">
      <div class="panel-header">
        <span class="panel-title">Maps</span>
        <input type="text" id="map-filter" class="map-filter-input" placeholder="Filter…">
      </div>
      <div id="url-import-row">
        <input type="text" id="url-import-input" class="map-filter-input url-import-input" placeholder="Paste map URL to import…">
        <button id="url-import-btn" class="action-btn">Import</button>
      </div>
      <div id="url-import-status" class="url-import-status" hidden></div>
      <div id="map-list">
        <div class="list-placeholder">Configure paths above to load maps.</div>
      </div>
    </div>

    <div id="map-detail-panel">
      <div id="map-detail-empty" class="detail-placeholder">
        Select a map from the list to view its status.
      </div>
      <div id="map-detail-content" hidden>

        <div class="detail-main-row">
          <div class="detail-main-col">
            <div class="detail-map-name" id="detail-map-name"></div>
            <div class="detail-config-status" id="detail-config-status"></div>

            <div class="detail-block">
              <div class="detail-block-title">Validation</div>
              <div id="detail-validation"></div>
            </div>

            <div class="detail-block">
              <div class="detail-block-title">Pipeline Steps</div>
              <div id="detail-steps"></div>
            </div>
          </div>

          <div class="detail-side-col">
            <img id="detail-map-thumbnail" class="detail-map-thumbnail" hidden alt="">
            <div id="detail-map-placeholder" class="detail-map-placeholder" hidden>No map.png found</div>

            <div class="detail-actions" id="detail-actions"></div>

            <div id="open-editor-wrap">
              <a id="open-editor-btn" class="open-editor-btn" hidden>Open in Editor &#8594;</a>
            </div>
          </div>
        </div>

        <div id="pipeline-console" hidden>
          <div class="console-header">
            <span class="console-title">Console</span>
            <button id="console-clear-btn" class="console-clear-btn">Clear</button>
          </div>
          <div id="console-output" class="console-output"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
